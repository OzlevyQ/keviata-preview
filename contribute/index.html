<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https://tbapyjqcsyoordncilte.supabase.co wss://tbapyjqcsyoordncilte.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'"><title>כתיבת מהדורה · קביעותא</title><link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/app.css"><link rel="stylesheet" href="contribute.css"><script src="../js/theme.js"></script></head>
<body>
<header class="cbar">
  <div class="cbar-inner">
    <a class="brand" href="../" aria-label="קביעותא, חזרה לאפליקציה"><span class="mark" aria-hidden="true">ק</span><span class="wordmark">קביעותא</span></a>
    <a class="cbar-back" href="../"><svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>חזרה לאפליקציה</a>
  </div>
</header>
<main>
  <p id="status" role="status" aria-live="polite"></p>

  <section id="gate" class="gate" hidden>
    <div class="gate-card card">
      <span class="gate-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="30" height="30"><path d="M12 3l3 6 6 .9-4.5 4.3 1 6.3L12 17.8 6.5 20.5l1-6.3L3 9.9 9 9z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
      <h1 class="gate-title">כתיבה בקביעותא</h1>
      <p class="gate-msg">כדי לכתוב מהדורות צריך הרשאת כתיבה מהעורכים. אפשר לבקש הרשאה ממסך הפרופיל, ונחזור אליכם.</p>
      <a class="btn primary" href="../#/profile">לבקשת הרשאה</a>
    </div>
  </section>

  <section id="workspace" hidden>
    <div class="page-head">
      <p class="eyebrow">כתיבה בקביעותא</p>
      <h1>המהדורות שלי</h1>
      <p class="page-sub">כתבו מהדורה, שמרו כטיוטה, ושלחו לאישור העורכים.</p>
      <button id="new" type="button" class="btn primary"><svg viewBox="0 0 24 24" aria-hidden="true" width="20" height="20"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>מהדורה חדשה</button>
    </div>

    <div id="list"></div>

    <form id="editor" class="editor" hidden>
      <section class="ed-section card">
        <h2 class="ed-h">פרטי המהדורה</h2>
        <div class="field">
          <label for="title">כותרת</label>
          <input id="title" class="input" maxlength="200" required>
          <p class="counter" id="titleCount">0 / 200</p>
        </div>
        <div class="field">
          <label for="description">תיאור קצר</label>
          <textarea id="description" class="input ta" maxlength="1000"></textarea>
          <p class="counter" id="descCount">0 / 1000</p>
        </div>
        <div class="field">
          <label for="date">תאריך הפרסום</label>
          <input id="date" class="input" type="date" required>
        </div>
      </section>

      <section class="ed-section card">
        <h2 class="ed-h">כרטיסים</h2>
        <div id="cards"></div>
        <button type="button" id="add" class="add-card"><svg viewBox="0 0 24 24" aria-hidden="true" width="20" height="20"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>הוספת כרטיס</button>
      </section>

      <div class="ed-bar">
        <button type="button" id="close" class="btn ghost">סגירה</button>
        <button type="submit" id="saveDraft" class="btn">שמירת טיוטה</button>
        <button type="button" id="submit" class="btn primary">שליחה לאישור</button>
      </div>
    </form>
  </section>
</main>
<script type="module" src="contribute.js"></script>
</body></html>
